name: Workflow improvement
description: Propose a new node, adapter, contract change, or workflow hardening improvement.
title: "[Workflow]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow gap or user need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the node, adapter, contract, fixture, or documentation change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workflow contract
        - Agent loop or planner
        - Guardrails
        - Tool allowlist or gateway integration
        - AI node usage
        - Error handling
        - Evaluation or trajectory rubric
        - Documentation
        - CI or tooling
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Static verification passes
        - JSON verification passes
        - Fixture added or updated
        - README/docs updated
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and tradeoffs
      description: Include security, credential, live-mode, guardrail, and compatibility risks.
